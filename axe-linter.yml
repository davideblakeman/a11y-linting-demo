# axe Accessibility Linter config - target: WCAG 2.2 Level AA
# Docs: https://docs.deque.com/linter/4.0.0/en/axe-linter-configuration

# The linter has no wcag22 tags. Axe tags are per-version (wcag21aa only marks
# criteria added in 2.1), so all four are needed to cover 2.0 + 2.1 A/AA.
# The WCAG 2.2-only criteria (2.4.11, 2.5.7, 2.5.8, 3.2.6, 3.3.7, 3.3.8) are
# runtime/manual checks that no static linter rule covers.
tags:
  - wcag2a
  - wcag2aa
  - wcag21a
  - wcag21aa
  - EN-301-549
  - best-practice

# Best-practice-only rules (no WCAG success criterion) are downgraded to warnings
# so errors always mean a WCAG AA failure.
rules:
  aria-allowed-role: warn
  aria-dialog-name: warn
  aria-text: warn
  aria-treeitem-name: warn
  empty-heading: warn
  empty-table-header: warn
  heading-order: warn
  presentation-role-conflict: warn
  tabindex: warn

exclude:
  - node_modules/**
  - dist/**
  - .angular/**

global-components:
  # src/app/components/icon-button - renders <button> with projected content
  phoenix-icon-button:
    element: button
    attributes:
      - disabled
      - aria-*
